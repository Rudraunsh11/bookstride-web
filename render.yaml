# Render Blueprint for the static Bookstride site.
# Response headers that cannot be set from a <meta> tag (frame-ancestors,
# nosniff, framing protection) are sent here for every path.
services:
  - type: web
    name: bookstride
    runtime: static
    buildCommand: ""
    staticPublishPath: ./site
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
      - path: /sw.js
        name: Cache-Control
        value: no-cache
